depot:
  base-directory: /var/local/depot
  host: http://localhost:8080
  rate-limit:
    enabled: true
    max-attempts: 20
    window: 5m
  upload:
    max-size: 10GB
    chunk-size: 8MB
    ttl: 24h
    max-sessions: 10
  tenants:
    default:
      password: ${DEFAULT_TENANT_PASSWORD:}
      soft-delete: false
      backup: false

spring:
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-request-size: 500MB
      max-file-size: 500MB

server:
  forward-headers-strategy: framework

springdoc:
  packagesToScan: ch.unibas.medizin.depot.api
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
